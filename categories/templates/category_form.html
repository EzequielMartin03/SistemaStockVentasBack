{% extends 'index.html' %}
{% load static %}

{% block content %}
<div class="content-header">
  <div class="container-fluid">
    <h1 class="m-0 text-dark">
      {% if form.instance.pk %}Editar{% else %}Crear{% endif %} Categoría
    </h1>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <form method="post">
              {% csrf_token %}
              <div class="form-group">
                <label for="id_name">Nombre de la Categoría</label>
                {{ form.name }}
              </div>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Guardar
              </button>
              <a href="{% url 'category_list' %}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancelar
              </a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
